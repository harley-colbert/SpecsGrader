<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpecsGrader</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>SpecsGrader</h1>
        <p class="tagline">Risk classification tooling bootstrap</p>
      </header>
      <main>
        <section class="card">
          <h2>Health check</h2>
          <p>Verify that the backend is reachable.</p>
          <div class="actions">
            <button id="health-button" type="button">Check /api/health</button>
            <span id="health-result" role="status"></span>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
